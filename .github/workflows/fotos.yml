name: Fotos aufbereiten

on:
  push:
    branches: [main]
    paths: ["fotos/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fotos
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pillow installieren
        run: pip install pillow==11.3.0

      - name: Fotos verkleinern, Metadaten entfernen, gallery.json schreiben
        run: python .github/scripts/fotos.py .

      - name: Ergebnis committen
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fotos vorschau gallery.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            echo "geaendert=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Fotos aufbereitet"
            git pull --rebase
            git push
            echo "geaendert=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Website neu bauen
        if: steps.commit.outputs.geaendert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
