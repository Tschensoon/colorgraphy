"}, MERK="radcockpit.schluessel";
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var f=document.getElementById("f"),meldung=document.getElementById("meldung"),knopf=document.getElementById("ok");
  function oeffnen(bits){
    return crypto.subtle.importKey("raw",bits,"AES-GCM",false,["decrypt"])
      .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},k,b64(D.daten))})

    crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveBits"])
