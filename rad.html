      .then(function(klar){var html=new TextDecoder().decode(klar);
        // erst schreiben, wenn diese Passwortseite fertig geladen ist: sonst greift document.open() nicht
        // und ihr zentriertes Layout bleibt hängen (oben abgeschnittene Seite beim gemerkten Passwort)
        var los=function(){document.open();document.write(html);document.close()};
        if(document.readyState==="complete")los();else window.addEventListener("load",los,{once:true})});
  }
  function fragen(){f.hidden=false;document.getElementById("pw").focus()}
  if(!window.crypto||!crypto.subtle){f.hidden=false;knopf.disabled=true;meldung.textContent="Dieser Browser kann die Seite nicht entschlüsseln (https nötig).";return}
  var gemerkt=null;try{var g=JSON.parse(localStorage.getItem(MERK));if(g&&g.salz===D.salz)gemerkt=g.bits}catch(e){}
  if(gemerkt)oeffnen(b64(gemerkt)).catch(function(){try{localStorage.removeItem(MERK)}catch(e){}fragen()});else fragen();
  f.addEventListener("submit",function(e){
    e.preventDefault();knopf.disabled=true;meldung.textContent="";
    var pw=new TextEncoder().encode(document.getElementById("pw").value),bits;
    crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveBits"])
      .then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(D.salz),iterations:D.runden},k,256)})
      .then(function(b){bits=new Uint8Array(b);
        if(document.getElementById("merken").checked){try{localStorage.setItem(MERK,JSON.stringify({salz:D.salz,bits:btoa(String.fromCharCode.apply(null,bits))}))}catch(e){}}
        return oeffnen(bits)})
      .catch(function(){try{localStorage.removeItem(MERK)}catch(e){}knopf.disabled=false;meldung.textContent="Das Passwort stimmt nicht."});
  });
})();
</script>
</body>
